; ============================================================
; php.ini for Hostinger Shared Hosting
; Place this file in your project root (company-admin/)
; AND in public_html/ folder
; ============================================================

; PHP Version must be 8.3 (set in hPanel → PHP Configuration)

; Memory & Execution
memory_limit = 256M
max_execution_time = 300
max_input_time = 300

; File Uploads
upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 20

; Error Reporting (Production - hide errors)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /home/u704793455/logs/php_errors.log

; Session
session.gc_maxlifetime = 7200
session.cookie_secure = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"

; Security
expose_php = Off

; Extensions
extension = pdo_mysql
extension = mbstring
extension = openssl
extension = fileinfo
extension = curl
extension = zip
extension = gd
